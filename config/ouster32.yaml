common:
    lid_topic:  "/ouster/points"
    imu_topic:  "/ouster/imu"
    # imu_topic: "/vectornav/IMU"
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
    time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                  # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
    imu_odom_topic: "/Odometry/Imu"
    
preprocess:
    lidar_type: 3                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
    scan_line: 32
    timestamp_unit: 3                 # 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
    blind: 2.0

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    # fov_degree:    180
    det_range:     100.0
    lidar_mean_scantime: 0.03
    root_surf_voxel_size: 1
    use_kernal: false              # true: enable kernal function in observation function h(x)
    extrinsic_est_en:  true      # true: enable the online estimation of IMU-LiDAR extrinsic
    # for ouster sensor frame (using VN100 IMU)
    # extrinsic_T: [ 0.0, 0.0, -0.065 ] 
    # extrinsic_R: [1, 0, 0,
    #               0, -1, 0,
    #               0, 0, -1]
    # for ouster sensor frame (using ouster IMU)
    # extrinsic_T: [ 0.0, 0.0, 0.0 ] 
    # extrinsic_R: [1, 0, 0,
    #               0, 1, 0,
    #               0, 0, 1]
    # for ouster lidar frame (using ouster IMU)
    extrinsic_T: [-0.006253, 0.011775, 0.03055] #I^T_L
    extrinsic_R: [-1, 0, 0,
                  0, -1, 0,
                  0, 0, 1]

    load_offline_map: false
    offline_map_path: "/work/ctvlimo_ws/src/FAST_LIO/PCD/GlobalMap.pcd"

publish:
    path_en:  true
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: false       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: false  # true: output the point cloud scans in IMU-body-frame

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
